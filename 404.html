<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Reprendr.</title>
  <meta name="robots" content="noindex">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#F5F7FA;color:#1A1A2E;min-height:100vh;display:flex;flex-direction:column}
    :root{--blue:#1B3F6E;--red:#E02B2B;--gray2:#E8ECF2;--muted:#5A6478}
    nav{background:#fff;border-bottom:1px solid var(--gray2);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between}
    .logo .re{color:var(--blue);font-size:22px;font-weight:800;letter-spacing:-0.5px}
    .logo .ndr{color:var(--red);font-size:22px;font-weight:800;letter-spacing:-0.5px}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
    .box{text-align:center;max-width:480px}
    .code{font-size:80px;font-weight:800;color:var(--blue);line-height:1;margin-bottom:16px;opacity:.15}
    .emoji{font-size:56px;margin-bottom:20px}
    h1{font-size:26px;font-weight:800;color:var(--blue);margin-bottom:10px;letter-spacing:-.3px}
    p{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:32px}
    .btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:14px 32px;border-radius:8px;font-size:15px;font-weight:700;margin-right:10px;margin-bottom:10px}
    .btn-outline{display:inline-block;background:transparent;color:var(--blue);border:2px solid var(--blue);text-decoration:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600;margin-bottom:10px}
    footer{background:#12294A;color:rgba(255,255,255,.6);text-align:center;padding:16px 32px;font-size:12px}
    footer .re{color:#fff;font-weight:700}
    footer .ndr{color:var(--red);font-weight:700}
  </style>
</head>
<body>
  <nav>
    <div class="logo"><span class="re">Re</span><span class="ndr">prendr.</span></div>
  </nav>

  <div class="main">
    <div class="box">
      <div class="code">404</div>
      <div class="emoji">🔍</div>
      <h1>Cette page est introuvable</h1>
      <p>La page que vous cherchez n'existe pas ou a été déplacée. Pas d'inquiétude — votre dossier de contestation, lui, est bien là.</p>
      <div>
        <a href="/" class="btn">Retour à l'accueil →</a>
        <a href="mailto:contact@reprendr.fr" class="btn-outline">Nous contacter</a>
      </div>
    </div>
  </div>

  <footer>© 2026 <span class="re">Re</span><span class="ndr">prendr.</span> — Ce service ne constitue pas un conseil juridique.</footer>
</body>
</html>
